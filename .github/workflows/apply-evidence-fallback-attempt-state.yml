name: Apply evidence fallback attempt-state patch

on:
  push:
    branches: [fix/evidence-fallback-attempt-state-20260827]
    paths:
      - .github/workflows/apply-evidence-fallback-attempt-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: fix/evidence-fallback-attempt-state-20260827
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Apply exact retry-state patch
        run: node scripts/apply-evidence-fallback-attempt-state.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Run targeted evidence fallback regression
        run: npx vitest run services/agent-worker/src/current-evidence-fallback.test.ts services/agent-worker/src/core-tool-runtime-truncation.test.ts
      - name: Typecheck patched runtime
        run: npm run typecheck
      - name: Remove temporary patch machinery and push patch
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/apply-evidence-fallback-attempt-state.mjs .github/workflows/apply-evidence-fallback-attempt-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-worker/src/processor.ts services/agent-worker/src/current-evidence-fallback.test.ts scripts/apply-evidence-fallback-attempt-state.mjs .github/workflows/apply-evidence-fallback-attempt-state.yml
          git diff --cached --check
          git commit -m "Skip failed evidence fallback URLs"
          git push origin HEAD:fix/evidence-fallback-attempt-state-20260827

