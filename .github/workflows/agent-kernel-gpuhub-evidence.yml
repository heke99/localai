name: Agent Kernel GPUHub Evidence

on:
  workflow_run:
    workflows: ["Deploy GPUHub"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gpuhub-production
  cancel-in-progress: false

jobs:
  collect_evidence:
    name: Collect Agent Kernel V2 GPUHub evidence
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect explicit evidence request
        id: requested
        shell: bash
        run: |
          set -Eeuo pipefail
          run=false
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            if git diff --name-only HEAD^ HEAD -- | grep -Fxq 'ops/agent-kernel-gpuhub-evidence.request'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Agent Kernel GPUHub evidence requested: $run"

      - name: Validate production secrets
        if: steps.requested.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing required production-gpuhub secret: ${name}" >&2; exit 1; }
          done

      - name: Configure pinned SSH host identity
        if: steps.requested.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run observational evidence collection on GPUHub
        if: steps.requested.outputs.run == 'true'
        id: evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_sha='${{ github.event.workflow_run.head_sha }}'
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          local_dir="$RUNNER_TEMP/agent-kernel-gpuhub-evidence"
          mkdir -p "$local_dir"

          remote_result="$(ssh "${ssh_opts[@]}" "$remote" "bash -s -- '$expected_sha'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          root_dir="/root/autodl-tmp/localai"
          app_dir="$root_dir/app"
          env_file="$root_dir/secrets/gpuhub-worker.env"
          node_bin="$root_dir/runtime/node-current/bin/node"
          profile_file="$app_dir/infra/runtime/gpuhub-production-profile.env"
          model_port=6006
          run_id="$(date -u +'%Y%m%dT%H%M%SZ')"
          evidence_dir="$root_dir/logs/evals/agent-kernel-probes-$run_id"
          evidence_file="$evidence_dir/gpuhub-probe-evidence.json"

          [[ -x "$node_bin" && -f "$env_file" && -f "$profile_file" ]] || {
            echo "GPUHub evidence prerequisites missing" >&2
            exit 1
          }

          cd "$app_dir"
          current_sha="$(git rev-parse HEAD)"
          [[ "$current_sha" == "$expected_sha" ]] || {
            echo "refusing evidence run on wrong revision: expected=$expected_sha current=$current_sha" >&2
            exit 1
          }

          # shellcheck disable=SC1090
          source "$profile_file"
          [[ "$DIV3RSA_GPUHUB_PRODUCTION_PARALLEL" == "8" ]] || { echo "expected p8 production profile" >&2; exit 1; }
          [[ "$DIV3RSA_GPUHUB_PRODUCTION_TOTAL_CONTEXT" == "262144" ]] || { echo "expected 262144 total context" >&2; exit 1; }
          [[ "$DIV3RSA_GPUHUB_PRODUCTION_CONTEXT_PER_SLOT" == "32768" ]] || { echo "expected 32768 context per slot" >&2; exit 1; }
          [[ "${DIV3RSA_GPUHUB_PRODUCTION_SPEC_TYPE:-none}" == "ngram-mod" ]] || { echo "expected ngram-mod speculative profile" >&2; exit 1; }

          process="$(pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf')"
          [[ "$process" =~ --parallel[=\ ]+8 ]] || { echo "production process is not p8: $process" >&2; exit 1; }
          [[ "$process" =~ --ctx-size[=\ ]+262144 ]] || { echo "production process context mismatch: $process" >&2; exit 1; }
          [[ "$process" == *"--spec-type ngram-mod"* ]] || { echo "production speculative profile mismatch: $process" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${model_port}/health" >/dev/null
          screen -list | grep -F '.localai-agent' >/dev/null

          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          api_key="$(head -n1 "$root_dir/secrets/inference-api-key")"
          [[ -n "$api_key" ]] || { echo "inference API key missing" >&2; exit 1; }

          mkdir -p "$evidence_dir"
          export DIV3RSA_INFERENCE_BASE_URL="http://127.0.0.1:${model_port}/v1"
          export DIV3RSA_INFERENCE_API_KEY="$api_key"
          export DIV3RSA_MODEL_RUNTIME_ALIAS="localai-qwen38-v3-q8"
          export DIV3RSA_PROBE_EVIDENCE_OUTPUT="$evidence_file"
          export DIV3RSA_PROBE_LOAD_CONCURRENCY=8
          export DIV3RSA_PROBE_LOAD_REQUESTS_PER_WORKER=4
          export DIV3RSA_PROBE_LOAD_MAX_TOKENS=256
          export DIV3RSA_AGENT_KERNEL_V2_PROBE_MAX_OUTPUT_TOKENS=256
          export DIV3RSA_PROBE_TIMEOUT_MS=4000

          unset DIV3RSA_AGENT_KERNEL_V2_PROBES_ENABLED || true
          unset DIV3RSA_AGENT_KERNEL_V2_PROBE_SAMPLE_BPS || true

          echo "=== AGENT KERNEL GPUHUB EVIDENCE START ===" >&2
          "$node_bin" scripts/eval_agent_kernel_probes_gpuhub.mjs
          echo "=== AGENT KERNEL GPUHUB EVIDENCE END ===" >&2

          [[ -s "$evidence_file" ]] || { echo "evidence file missing" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:${model_port}/health" >/dev/null
          post_process="$(pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf')"
          [[ "$post_process" =~ --parallel[=\ ]+8 && "$post_process" =~ --ctx-size[=\ ]+262144 ]] || {
            echo "production process changed during evidence run" >&2
            exit 1
          }
          [[ "$post_process" == *"--spec-type ngram-mod"* ]] || { echo "speculative profile changed during evidence run" >&2; exit 1; }

          printf '%s\n' "$evidence_file"
          REMOTE
          )"

          remote_evidence="$(printf '%s\n' "$remote_result" | tail -n1)"
          [[ "$remote_evidence" == /root/autodl-tmp/localai/logs/evals/agent-kernel-probes-*/gpuhub-probe-evidence.json ]] || {
            echo "unexpected remote evidence path: $remote_evidence" >&2
            exit 1
          }

          scp "${ssh_opts[@]}" "$remote:$remote_evidence" "$local_dir/gpuhub-probe-evidence.json"
          printf '%s\n' "$remote_result"
          echo "artifact_path=$local_dir/gpuhub-probe-evidence.json" >> "$GITHUB_OUTPUT"

      - name: Upload evidence artifact
        if: steps.requested.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-kernel-gpuhub-probe-evidence
          path: ${{ steps.evidence.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14
