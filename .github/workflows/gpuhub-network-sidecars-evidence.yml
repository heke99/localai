name: GPUHub Network Sidecars Evidence

on:
  workflow_run:
    workflows: ["Deploy GPUHub"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: gpuhub-network-sidecars-evidence
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate production SSH material
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS DEPLOYED_SHA; do
            [[ -n "${!name:-}" ]] || { echo "Missing ${name}" >&2; exit 1; }
          done
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "invalid deployed sha" >&2; exit 1; }

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" >"$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Verify egress, browser capability and worker wiring on GPUHub
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )
          ssh "${ssh_opts[@]}" "$remote" "bash -s -- '${DEPLOYED_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          app_dir="/root/autodl-tmp/localai/app"
          node_bin="/root/autodl-tmp/localai/runtime/node-current/bin/node"
          proxy="http://127.0.0.1:7318"
          browser="http://127.0.0.1:7320"
          token_file="/var/lib/div3rsa-browser/executor.token"
          unavailable_file="/var/lib/div3rsa-browser/unavailable.reason"
          browser_user="div3rsa-browser"
          firewall_chain="DIV3RSA_BROWSER"

          cd "$app_dir"
          git cat-file -e "${expected_sha}^{commit}"
          current_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$expected_sha" "$current_sha" || {
            echo "GPUHub checkout does not contain verified deployment: expected=$expected_sha current=$current_sha" >&2
            exit 1
          }
          [[ -x "$node_bin" ]] || { echo "tracked GPUHub Node runtime missing" >&2; exit 1; }

          screen -list | grep -F '.localai-egress' >/dev/null
          curl --fail --silent --show-error --max-time 3 "$proxy/_div3rsa_health" >/dev/null
          egress_pid="$(pgrep -f '/opt/div3rsa/egress-proxy/main\.ts' | head -n1 || true)"
          [[ -n "$egress_pid" ]] || { echo "egress process PID missing" >&2; exit 1; }
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' "/proc/${egress_pid}/status"
          [[ "$(awk '/^Uid:/{print $2}' "/proc/${egress_pid}/status")" != "0" ]]

          blocked_code="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' --proxy "$proxy" http://127.0.0.1/ || true)"
          [[ "$blocked_code" == "403" ]] || { echo "loopback egress negative gate failed: $blocked_code" >&2; exit 1; }
          metadata_code="$(curl --silent --show-error --max-time 5 --output /dev/null --write-out '%{http_code}' --proxy "$proxy" http://169.254.169.254/latest/meta-data/ || true)"
          [[ "$metadata_code" == "403" ]] || { echo "metadata egress negative gate failed: $metadata_code" >&2; exit 1; }
          curl --fail --silent --show-error --max-time 10 --proxy "$proxy" https://example.com/ >/dev/null

          worker_pid="$(pgrep -f 'services/agent-worker/src/main\.ts' | head -n1 || true)"
          [[ -n "$worker_pid" ]] || { echo "agent worker PID unavailable" >&2; exit 1; }
          worker_env="$(tr '\0' '\n' <"/proc/${worker_pid}/environ")"
          grep -Fxq 'NODE_USE_ENV_PROXY=1' <<<"$worker_env"
          grep -Fxq 'HTTP_PROXY=http://127.0.0.1:7318' <<<"$worker_env"
          grep -Fxq 'HTTPS_PROXY=http://127.0.0.1:7318' <<<"$worker_env"
          grep -Fxq 'DIV3RSA_EGRESS_PROXY_URL=http://127.0.0.1:7318' <<<"$worker_env"

          if [[ -f "$unavailable_file" ]]; then
            reason="$(tr -d '\r\n' <"$unavailable_file")"
            [[ "$reason" == "unavailable_host_isolation" ]] || { echo "unexpected browser unavailable reason: $reason" >&2; exit 1; }
            [[ "$(stat -c '%u:%a' "$unavailable_file")" == "0:640" ]] || { echo "browser unavailable marker permissions invalid" >&2; exit 1; }
            if screen -list | grep -F '.localai-browser' >/dev/null; then
              echo "browser screen must be absent when capability is disabled" >&2
              exit 1
            fi
            if pgrep -f '/opt/div3rsa/browser-executor/main\.ts' >/dev/null; then
              echo "browser executor process must be absent when capability is disabled" >&2
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 2 "$browser/health" >/dev/null 2>&1; then
              echo "browser listener must be absent when capability is disabled" >&2
              exit 1
            fi
            [[ ! -e "$token_file" ]] || { echo "browser token must be absent when capability is disabled" >&2; exit 1; }
            if grep -q '^DIV3RSA_BROWSER_EXECUTOR_URL=' <<<"$worker_env"; then
              echo "worker must not receive DIV3RSA_BROWSER_EXECUTOR_URL when browser is unavailable" >&2
              exit 1
            fi
            if grep -q '^DIV3RSA_BROWSER_EXECUTOR_TOKEN=' <<<"$worker_env"; then
              echo "worker must not receive DIV3RSA_BROWSER_EXECUTOR_TOKEN when browser is unavailable" >&2
              exit 1
            fi
            echo "GPUHUB_NETWORK_SIDECARS_E2E_OK commit=${current_sha} browser_isolation=unavailable_host_isolation"
            exit 0
          fi

          screen -list | grep -F '.localai-browser' >/dev/null
          health_json="$(curl --fail --silent --show-error --max-time 3 "$browser/health")"
          isolation="$($node_bin -e 'const h=JSON.parse(process.argv[1]);if(h.ok!==true||h.service!=="browser-executor"||h.proxy!==true)process.exit(1);process.stdout.write(String(h.isolation||""))' "$health_json")"
          chromium_sandbox="$($node_bin -e 'const h=JSON.parse(process.argv[1]);process.stdout.write(String(h.chromiumSandbox))' "$health_json")"
          case "$isolation" in
            chromium)
              [[ "$chromium_sandbox" == "true" ]] || { echo "Chromium isolation reported without Chromium sandbox" >&2; exit 1; }
              ;;
            uid-firewall)
              [[ "$chromium_sandbox" == "false" ]] || { echo "UID-firewall isolation must disable only Chromium's unavailable inner sandbox" >&2; exit 1; }
              ;;
            *)
              echo "unknown browser isolation mode: $isolation" >&2
              exit 1
              ;;
          esac

          browser_pid="$(pgrep -f '/opt/div3rsa/browser-executor/main\.ts' | head -n1 || true)"
          [[ -n "$browser_pid" ]] || { echo "browser process PID missing" >&2; exit 1; }
          grep -Eq '^NoNewPrivs:[[:space:]]+1$' "/proc/${browser_pid}/status"
          browser_uid="$(awk '/^Uid:/{print $2}' "/proc/${browser_pid}/status")"
          [[ "$browser_uid" != "0" ]] || { echo "browser executor unexpectedly runs as root" >&2; exit 1; }
          grep -Eq '^CapEff:[[:space:]]+0+$' "/proc/${browser_pid}/status" || { echo "browser executor effective capabilities are not empty" >&2; exit 1; }
          grep -Eq '^CapBnd:[[:space:]]+0+$' "/proc/${browser_pid}/status" || { echo "browser executor capability bounding set is not empty" >&2; exit 1; }
          browser_gid="$(id -g "$browser_user")"

          [[ -s "$token_file" ]] || { echo "browser token missing" >&2; exit 1; }
          token="$(tr -d '\r\n' <"$token_file")"
          [[ "$token" =~ ^[0-9a-f]{64}$ ]] || { echo "browser token invalid" >&2; exit 1; }
          grep -Fxq 'DIV3RSA_BROWSER_EXECUTOR_URL=http://127.0.0.1:7320' <<<"$worker_env"
          grep -Eq '^DIV3RSA_BROWSER_EXECUTOR_TOKEN=[0-9a-f]{64}$' <<<"$worker_env"

          allowed_payload='{"runId":"gpuhub-evidence","requestId":"navigate-allowed","traceId":"gpuhub-network-evidence","action":"browser_navigate","timeoutMs":15000,"executionClass":"passive","scope":{"scopeId":"evidence-example","allowHosts":["example.com"],"allowIpv4Cidrs":[]},"input":{"url":"https://example.com/"}}'
          allowed_result="$(curl --fail --silent --show-error --max-time 20 -H "authorization: Bearer ${token}" -H 'content-type: application/json' --data-binary "$allowed_payload" "$browser/v1/execute")"
          "$node_bin" -e 'const v=JSON.parse(process.argv[1]);if(v.ok!==true||v.action!=="browser_navigate"||!String(v.url||"").startsWith("https://example.com"))process.exit(1)' "$allowed_result"

          chromium_processes="$(pgrep -a -u "$browser_uid" -f '/opt/div3rsa/browser-executor/browsers/chromium-.*/chrome-linux64/chrome' || true)"
          [[ -n "$chromium_processes" ]] || { echo "Chromium process missing after navigation" >&2; exit 1; }
          grep -F -- '--proxy-server=http://127.0.0.1:7318' <<<"$chromium_processes" >/dev/null || { echo "Chromium is not pinned to controlled egress proxy" >&2; exit 1; }

          if [[ "$isolation" == "chromium" ]]; then
            if grep -F -- '--no-sandbox' <<<"$chromium_processes" >/dev/null; then
              echo "Chromium isolation mode unexpectedly launched with --no-sandbox" >&2
              exit 1
            fi
            renderer_pid="$(pgrep -u "$browser_uid" -f 'chrome.*--type=renderer' | head -n1 || true)"
            [[ -n "$renderer_pid" ]] || { echo "Chromium renderer process missing after navigation" >&2; exit 1; }
            grep -Eq '^Seccomp:[[:space:]]+2$' "/proc/${renderer_pid}/status" || { echo "Chromium renderer seccomp sandbox not active" >&2; exit 1; }
          else
            command -v iptables >/dev/null 2>&1 || { echo "iptables missing for uid-firewall isolation" >&2; exit 1; }
            command -v ip6tables >/dev/null 2>&1 || { echo "ip6tables missing for uid-firewall isolation" >&2; exit 1; }
            iptables -C OUTPUT -m owner --uid-owner "$browser_uid" -j "$firewall_chain"
            iptables -C "$firewall_chain" -p tcp -d 127.0.0.1 --dport 7318 -j ACCEPT
            iptables -C "$firewall_chain" -j REJECT
            ip6tables -C OUTPUT -m owner --uid-owner "$browser_uid" -j "$firewall_chain"
            ip6tables -C "$firewall_chain" -j REJECT
            run_browser() {
              setpriv --reuid="$browser_uid" --regid="$browser_gid" --init-groups --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all "$@"
            }
            if run_browser curl --silent --fail --max-time 3 http://127.0.0.1:6006/health >/dev/null 2>&1; then
              echo "uid-firewall browser can reach model directly" >&2; exit 1
            fi
            if run_browser curl --silent --fail --insecure --max-time 3 https://1.1.1.1/ >/dev/null 2>&1; then
              echo "uid-firewall browser can reach public internet directly" >&2; exit 1
            fi
            run_browser curl --silent --fail --max-time 10 --proxy "$proxy" https://example.com/ >/dev/null
          fi

          blocked_payload='{"runId":"gpuhub-evidence-blocked","requestId":"navigate-blocked","traceId":"gpuhub-network-evidence","action":"browser_navigate","timeoutMs":10000,"executionClass":"passive","scope":{"scopeId":"evidence-example","allowHosts":["example.com"],"allowIpv4Cidrs":[]},"input":{"url":"https://www.iana.org/"}}'
          browser_blocked_code="$(curl --silent --show-error --max-time 15 --output /tmp/div3rsa-browser-blocked.json --write-out '%{http_code}' -H "authorization: Bearer ${token}" -H 'content-type: application/json' --data-binary "$blocked_payload" "$browser/v1/execute" || true)"
          [[ "$browser_blocked_code" == "400" ]] || { cat /tmp/div3rsa-browser-blocked.json >&2 || true; echo "browser out-of-scope gate failed: $browser_blocked_code" >&2; exit 1; }

          echo "GPUHUB_NETWORK_SIDECARS_E2E_OK commit=${current_sha} browser_isolation=${isolation}"
          REMOTE
