name: Deploy GPUHub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpuhub-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact main revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Validate GPUHub runtime shells
        run: |
          bash -n infra/runtime/upgrade-legacy-gpuhub.sh
          bash -n infra/runtime/recover-legacy-gpuhub.sh
          bash -n infra/runtime/benchmark-legacy-gpuhub-parallel.sh

      - name: Native TypeScript runtime smoke test
        run: npm run test:native-runtime

      - name: Unit and integration tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy:
    name: Deploy exact revision to GPUHub
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate deploy secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            GPUHUB_SSH_HOST \
            GPUHUB_SSH_PORT \
            GPUHUB_SSH_USER \
            GPUHUB_SSH_PRIVATE_KEY \
            GPUHUB_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production-gpuhub secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Recover, deploy and verify GPUHub runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          ssh "${ssh_opts[@]}" "$remote" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          app_dir="/root/autodl-tmp/localai/app"
          upgrade_script="/tmp/div3rsa-gpuhub-upgrade-${expected_sha}.sh"
          recovery_script="/tmp/div3rsa-gpuhub-recovery-${expected_sha}.sh"

          [[ "$expected_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "invalid expected commit sha" >&2
            exit 1
          }
          [[ -d "$app_dir/.git" ]] || {
            echo "GPUHub checkout missing: $app_dir" >&2
            exit 1
          }

          cd "$app_dir"
          git fetch --prune origin main
          git cat-file -e "${expected_sha}^{commit}"
          git merge-base --is-ancestor "$expected_sha" FETCH_HEAD || {
            echo "refusing to deploy commit that is not contained in origin/main" >&2
            exit 1
          }

          git show "${expected_sha}:infra/runtime/recover-legacy-gpuhub.sh" > "$recovery_script"
          git show "${expected_sha}:infra/runtime/upgrade-legacy-gpuhub.sh" > "$upgrade_script"
          chmod 700 "$recovery_script" "$upgrade_script"
          trap 'rm -f "$recovery_script" "$upgrade_script"' EXIT

          echo "=== GPUHub pre-deploy recovery ==="
          bash "$recovery_script"

          echo "=== GPUHub exact-revision deploy ==="
          DIV3RSA_RUNTIME_GIT_REF=main \
          DIV3RSA_EXPECTED_COMMIT_SHA="$expected_sha" \
            bash "$upgrade_script"

          current_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$expected_sha" "$current_sha" || {
            echo "GPUHub checkout does not contain deployed commit: expected=$expected_sha current=$current_sha" >&2
            exit 1
          }

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6006/health >/dev/null
          curl --fail --silent --show-error --max-time 8 'http://127.0.0.1:8890/search?q=div3rsa-deploy-health&format=json' >/dev/null
          screen -list | grep -F '.localai-agent' >/dev/null
          pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf'
          echo "GPUHub deploy healthy: requested=${expected_sha} current=${current_sha}"
          REMOTE

  eval_benchmark:
    name: Prompt eval then parallel 1/2/4/8 benchmark
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
      GITHUB_BEFORE: ${{ github.event.before }}
    steps:
      - name: Checkout benchmark request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect explicit benchmark request
        id: requested
        shell: bash
        run: |
          set -Eeuo pipefail
          run=false
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            run=true
          elif [[ -n "${GITHUB_BEFORE:-}" && ! "${GITHUB_BEFORE}" =~ ^0+$ ]]; then
            if git diff --name-only "$GITHUB_BEFORE" "$GITHUB_SHA" -- | grep -Fxq 'ops/gpuhub-eval-benchmark.request'; then
              run=true
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "GPUHub eval/benchmark requested: $run"

      - name: Validate benchmark secrets
        if: steps.requested.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing required production-gpuhub secret: ${name}" >&2; exit 1; }
          done

      - name: Configure pinned SSH host identity
        if: steps.requested.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run real agent eval then GPU parallel benchmark
        if: steps.requested.outputs.run == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          ssh "${ssh_opts[@]}" "$remote" "bash -s -- '${GITHUB_SHA}'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          root_dir="/root/autodl-tmp/localai"
          app_dir="$root_dir/app"
          env_file="$root_dir/secrets/gpuhub-worker.env"
          node_bin="$root_dir/runtime/node-current/bin/node"
          run_id="$(date -u +'%Y%m%dT%H%M%SZ')"
          eval_dir="$root_dir/logs/evals/$run_id"
          benchmark_dir="$root_dir/logs/benchmarks/$run_id"

          [[ -x "$node_bin" ]] || { echo "GPUHub Node runtime missing: $node_bin" >&2; exit 1; }
          [[ -f "$env_file" ]] || { echo "GPUHub worker env missing: $env_file" >&2; exit 1; }
          cd "$app_dir"
          current_sha="$(git rev-parse HEAD)"
          [[ "$current_sha" == "$expected_sha" ]] || {
            echo "refusing benchmark on wrong revision: expected=$expected_sha current=$current_sha" >&2
            exit 1
          }
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6006/health >/dev/null
          curl --fail --silent --show-error --max-time 8 'http://127.0.0.1:8890/search?q=div3rsa-eval-health&format=json' >/dev/null
          screen -list | grep -F '.localai-agent' >/dev/null

          mkdir -p "$eval_dir" "$benchmark_dir"
          set -a
          # shellcheck disable=SC1090
          source "$env_file"
          set +a
          export DIV3RSA_REPOSITORY_ROOT="$app_dir"
          export DIV3RSA_EVAL_COMMIT_SHA="$expected_sha"
          export DIV3RSA_EVAL_OUTPUT="$eval_dir/result.json"
          export DIV3RSA_BENCH_OUTPUT_DIR="$benchmark_dir"
          export DIV3RSA_BENCH_SERVER_PARALLEL="1,2,4,8"
          export DIV3RSA_BENCH_CONCURRENCY="1,2,4,8"
          export DIV3RSA_BENCHMARK_CONFIRM_DOWNTIME="YES"

          echo "=== AGENT EVAL START ==="
          set +e
          "$node_bin" --experimental-transform-types --import ./infra/runpod/native-typescript-register.mjs scripts/eval_agent_runtime.ts \
            >"$eval_dir/stdout.json" 2>"$eval_dir/stderr.log"
          eval_status=$?
          set -e
          cat "$eval_dir/stderr.log"
          cat "$eval_dir/stdout.json"
          echo "=== AGENT EVAL STATUS: $eval_status ==="

          if [[ "$eval_status" -ne 0 ]]; then
            echo "Agent eval failed; refusing to start GPU parallel benchmark. Evidence: $eval_dir" >&2
            exit "$eval_status"
          fi

          echo "=== PARALLEL BENCHMARK START ==="
          set +e
          bash infra/runtime/benchmark-legacy-gpuhub-parallel.sh \
            >"$benchmark_dir/summary.json" 2>"$benchmark_dir/runner.stderr.log"
          benchmark_status=$?
          set -e
          cat "$benchmark_dir/runner.stderr.log"
          cat "$benchmark_dir/summary.json"
          echo "=== PARALLEL BENCHMARK STATUS: $benchmark_status ==="
          echo "Evidence: eval=$eval_dir benchmark=$benchmark_dir commit=$expected_sha"

          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6006/health >/dev/null || {
            echo "Qwen unhealthy after benchmark; invoking recovery" >&2
            bash infra/runtime/recover-legacy-gpuhub.sh
          }
          screen -list | grep -F '.localai-agent' >/dev/null || bash infra/runtime/recover-legacy-gpuhub.sh
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6006/health >/dev/null
          screen -list | grep -F '.localai-agent' >/dev/null

          if [[ "$benchmark_status" -ne 0 ]]; then exit "$benchmark_status"; fi
          REMOTE