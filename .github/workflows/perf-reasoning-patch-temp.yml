name: Temporary final reasoning patch

on:
  push:
    branches:
      - perf/end-to-end-latency-20260828
    paths:
      - scripts/perf_reasoning_patch_temp.py
      - .github/workflows/perf-reasoning-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/end-to-end-latency-20260828
          fetch-depth: 0
      - name: Apply measured reasoning policy
        run: python3 scripts/perf_reasoning_patch_temp.py
      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/perf_reasoning_patch_temp.py .github/workflows/perf-reasoning-patch-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/model-gateway/src/openai-compatible-adapter.ts services/model-gateway/src/fast-reasoning-routing.test.ts scripts/perf_reasoning_patch_temp.py .github/workflows/perf-reasoning-patch-temp.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Keep STANDARD reasoning at measured safe default"
          git push origin HEAD:perf/end-to-end-latency-20260828
