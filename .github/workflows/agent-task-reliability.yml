name: Agent task reliability

on:
  workflow_run:
    workflows: ["Deploy GPUHub"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: agent-task-reliability
  cancel-in-progress: false

jobs:
  reliability:
    name: Model conformance + real-agent E2E
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate production access
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Invalid deployed SHA" >&2; exit 1; }
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing required production-gpuhub secret: ${name}" >&2; exit 1; }
          done

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run model conformance and hermetic task reliability
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          ssh "${ssh_opts[@]}" "$remote" "bash -s -- '$DEPLOYED_SHA'" <<'REMOTE'
          set -Eeuo pipefail
          expected_sha="$1"
          root_dir="/root/autodl-tmp/localai"
          app_dir="$root_dir/app"
          env_file="$root_dir/secrets/gpuhub-worker.env"
          node_bin="$root_dir/runtime/node-current/bin/node"
          [[ -d "$app_dir/.git" && -f "$env_file" && -x "$node_bin" ]] || { echo "task reliability prerequisites missing" >&2; exit 1; }
          cd "$app_dir"
          current_sha="$(git rev-parse HEAD)"
          if [[ "$current_sha" != "$expected_sha" ]]; then
            if git merge-base --is-ancestor "$expected_sha" "$current_sha"; then
              echo "Skipping stale task reliability gate: requested=$expected_sha current=$current_sha"
              exit 0
            fi
            echo "GPUHub revision mismatch: requested=$expected_sha current=$current_sha" >&2
            exit 1
          fi

          set -a
          source "$env_file"
          set +a
          export DIV3RSA_REPOSITORY_ROOT="$app_dir"
          export DIV3RSA_EVAL_COMMIT_SHA="$expected_sha"
          conformance_json="$(mktemp "$root_dir/logs/model-conformance.XXXXXX.json")"
          reliability_json="$(mktemp "$root_dir/logs/task-reliability.XXXXXX.json")"
          cleanup() { rm -f "$conformance_json" "$reliability_json"; }
          trap cleanup EXIT

          export DIV3RSA_MODEL_CONFORMANCE_OUTPUT="$conformance_json"
          "$node_bin" --experimental-transform-types --import ./infra/runpod/native-typescript-register.mjs scripts/eval_model_conformance.ts
          python3 - "$conformance_json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('cases') != 5 or data.get('passed') != 5 or data.get('failed') != 0 or data.get('allowed') is not True:
              raise SystemExit(1)
          PY

          export DIV3RSA_TASK_RELIABILITY_OUTPUT="$reliability_json"
          "$node_bin" --experimental-transform-types --import ./infra/runpod/native-typescript-register.mjs scripts/eval_agent_task_reliability.ts
          python3 - "$reliability_json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('cases') != 7 or data.get('passed') != 7 or data.get('failed') != 0 or data.get('passRate') != 1 or data.get('allowed') is not True:
              raise SystemExit(1)
          PY

          python3 - "$conformance_json" "$reliability_json" "$expected_sha" <<'PY'
          import json,sys
          conformance=json.load(open(sys.argv[1],encoding='utf-8'))
          reliability=json.load(open(sys.argv[2],encoding='utf-8'))
          sha=sys.argv[3]
          model=reliability.get('configuredModelVersionId') or conformance.get('expectedModelVersionId') or 'unknown'
          protocol=reliability.get('modelProtocol') or conformance.get('protocol') or 'unknown'
          print(f"AGENT_TASK_RELIABILITY_PASSED sha={sha} model={model} protocol={protocol} tasks=7/7 conformance=5/5")
          PY
          REMOTE
