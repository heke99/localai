name: Temporary apply ngram promotion patch

on:
  push:
    branches: ["perf/qwen-runtime-latency-20260828"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/qwen-runtime-latency-20260828
      - name: Apply validated permanent non-workflow patch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ ! -f scripts/temp_apply_ngram_promotion.py ]]; then
            echo "Permanent non-workflow patch already applied."
            exit 0
          fi
          python3 scripts/temp_fix_ngram_patch.py
          python3 scripts/temp_apply_ngram_promotion.py
          rm -f \
            scripts/temp_fix_ngram_patch.py \
            scripts/temp_apply_ngram_promotion.py \
            scripts/temp_ngram_agent_gate.sh \
            scripts/temp_qwen_runtime_perf_probe.mjs \
            scripts/temp_qwen_runtime_benchmark.sh
          npm run validate:runtime-startup
          npm run test:gpuhub-production-profile
          git diff --check
          # The Actions token cannot modify workflow files. Keep every workflow
          # delta at HEAD here; the connected repo action applies the validated
          # deploy/verification changes separately with the required permission.
          git checkout HEAD -- \
            .github/workflows/deploy-gpuhub.yml \
            .github/workflows/p8-promotion-verify.yml \
            .github/workflows/temp-apply-ngram-promotion.yml
          git config user.name "heke99"
          git config user.email "129280077+heke99@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Promote ngram speculative decoding on GPUHub"
          git push origin HEAD:perf/qwen-runtime-latency-20260828
