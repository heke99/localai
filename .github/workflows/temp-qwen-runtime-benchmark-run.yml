name: Temporary Qwen runtime benchmark run

on:
  push:
    branches: ["perf/qwen-runtime-latency-20260828"]

permissions:
  contents: read

concurrency:
  group: gpuhub-production
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS; do [[ -n "${!name:-}" ]] || exit 1; done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload and execute benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          opts=(-i "$HOME/.ssh/id_ed25519" -p "$GPUHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$remote" 'cat > /tmp/div3rsa-qwen-runtime-perf.mjs' < scripts/temp_qwen_runtime_perf_probe.mjs
          ssh "${opts[@]}" "$remote" 'cat > /tmp/div3rsa-qwen-runtime-benchmark.sh && chmod 700 /tmp/div3rsa-qwen-runtime-benchmark.sh' < scripts/temp_qwen_runtime_benchmark.sh
          ssh "${opts[@]}" "$remote" 'bash /tmp/div3rsa-qwen-runtime-benchmark.sh'
