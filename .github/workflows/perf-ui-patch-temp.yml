name: Temporary performance UI patch

on:
  push:
    branches:
      - perf/end-to-end-latency-20260828
    paths:
      - scripts/perf_ui_patch_temp.py
      - .github/workflows/perf-ui-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/end-to-end-latency-20260828
          fetch-depth: 0
      - name: Apply exact UI latency patch
        run: python3 scripts/perf_ui_patch_temp.py
      - name: Verify and commit patch
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/perf_ui_patch_temp.py .github/workflows/perf-ui-patch-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/app/dashboard/workspace-shell-v4.tsx scripts/perf_ui_patch_temp.py .github/workflows/perf-ui-patch-temp.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Make chat submit and stream UI low latency"
          git push origin HEAD:perf/end-to-end-latency-20260828
