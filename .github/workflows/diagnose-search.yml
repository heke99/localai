name: Diagnose production search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-search.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpuhub-production
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect SearXNG source quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
    steps:
      - name: Validate diagnostic secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            GPUHUB_SSH_HOST \
            GPUHUB_SSH_PORT \
            GPUHUB_SSH_USER \
            GPUHUB_SSH_PRIVATE_KEY \
            GPUHUB_SSH_KNOWN_HOSTS; do
            [[ -n "${!name:-}" ]] || { echo "Missing required production-gpuhub secret: ${name}" >&2; exit 1; }
          done

      - name: Configure pinned SSH host identity
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Run read-only source-quality diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -p "$GPUHUB_SSH_PORT"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )

          ssh "${ssh_opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          search_url='http://127.0.0.1:8890'
          app_dir='/root/autodl-tmp/localai/app'

          echo '=== RUNTIME STATE ==='
          printf 'commit=' && git -C "$app_dir" rev-parse HEAD
          pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf' || true
          screen -list | grep -E '\.(localai-search|localai-agent)' || true

          probe_quality() {
            local label="$1"
            local query="$2"
            local engines="$3"
            local expected_domain="$4"
            echo "=== QUALITY PROBE: ${label} engines=${engines} ==="
            curl --get --fail --silent --show-error --max-time 18 \
              --data-urlencode "q=${query}" \
              --data-urlencode 'format=json' \
              --data-urlencode "engines=${engines}" \
              "$search_url/search" \
              | EXPECTED_DOMAIN="$expected_domain" python3 -c 'import json,os,sys; from urllib.parse import urlparse; body=json.load(sys.stdin); results=body.get("results") or []; urls=[str(x.get("url") or "") for x in results[:12]]; domains=[urlparse(u).hostname or "" for u in urls]; expected=os.environ["EXPECTED_DOMAIN"].lower(); print(json.dumps({"result_count":len(results),"result_engines":sorted({str(x.get("engine")) for x in results if x.get("engine")}),"expected_domain":expected,"official_domain_present":any(d==expected or d.endswith("."+expected) for d in domains),"top_domains":domains,"top_urls":urls,"unresponsive_engines":body.get("unresponsive_engines") or []},ensure_ascii=False))'
          }

          for engines in bing yahoo bing,yahoo; do
            probe_quality 'node-current' 'Node.js current release' "$engines" 'nodejs.org'
            probe_quality 'swedish-vat' 'Skatteverket moms 25 procent' "$engines" 'skatteverket.se'
          done
          REMOTE
