name: Database consistency

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Replay migrations and invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Start local database and replay migrations
        run: supabase db start

      - name: Run raw SQL invariant tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          test -n "${DB_URL:-}"
          for test_file in supabase/tests/*.sql; do
            echo "Running ${test_file}"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$test_file"
          done

      - name: Lint database
        run: supabase db lint --local --level error

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  migrate-production:
    name: Apply production migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: localai-supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPECTED_SUPABASE_PROJECT_REF: eaebyxwedmwhctoqrvji
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest

      - name: Validate production target
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PROJECT_REF:-}"
          if [ "$SUPABASE_PROJECT_REF" != "$EXPECTED_SUPABASE_PROJECT_REF" ]; then
            echo "Refusing migration: configured project ref is not LocalAI production." >&2
            exit 1
          fi

      - name: Link exact production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending production migrations
        run: supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply pending production migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration history
        run: supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
