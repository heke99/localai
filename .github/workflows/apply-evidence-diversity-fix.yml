name: Apply evidence diversity fix

on:
  push:
    branches: [fix/post-load-evidence-diversity-20260827]
    paths:
      - .github/workflows/apply-evidence-diversity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-load-evidence-diversity-20260827
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply bounded multi-source fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('services/agent-worker/src/processor.ts')
          text = path.read_text()
          old = '''                const candidate = rankSearchCandidates(searchOutput, contract.normalizedPrompt)
                  .find((item) => !openedUrls.has(item.url) && !attemptedFallbackUrls.has(item.url));
                if (!candidate) {
                  await this.queue.step(run.runId, "tool", "blocked", "Deterministic evidence fallback found no new source", {
                    verificationRound,
                    researchAttempt,
                    query: fallbackQuery
                  });
                  continue;
                }

                attemptedFallbackUrls.add(candidate.url);

                const fetchCall: ModelToolCall = {
                  id: `${run.requestId}:grounding-fallback-fetch:${verificationRound}:${researchAttempt}`,
                  name: "web_fetch",
                  input: { url: candidate.url }
                };
                loopGuard.record({ action: fetchCall.name, inputHash: hashInput(fetchCall.input) });
                await this.queue.step(run.runId, "tool", "waiting_for_tool", "web_fetch", {
                  toolCallId: fetchCall.id,
                  verificationRound,
                  researchAttempt,
                  url: candidate.url,
                  deterministicEvidenceFallback: true
                });
                try {
                  const output = await this.tools.execute(run, fetchCall);
                  toolTrace.push({ sequence: toolTrace.length + 1, name: fetchCall.name, input: fetchCall.input, output });
                  messages.push({ role: "assistant", content: "", toolCalls: [fetchCall] });
                  messages.push({ role: "tool", name: fetchCall.name, toolCallId: fetchCall.id, content: compactToolOutput(output) });
                  openedNewSource = true;
                } catch (error) {
                  await this.queue.step(run.runId, "tool", "blocked", "Deterministic evidence fallback source fetch failed", {
                    verificationRound,
                    researchAttempt,
                    url: candidate.url,
                    error: error instanceof Error ? error.message : "web_fetch_failed"
                  });
                }
                continue;'''
          new = '''                const candidates = rankSearchCandidates(searchOutput, contract.normalizedPrompt)
                  .filter((item) => !openedUrls.has(item.url) && !attemptedFallbackUrls.has(item.url))
                  .slice(0, 3);
                if (!candidates.length) {
                  await this.queue.step(run.runId, "tool", "blocked", "Deterministic evidence fallback found no new source", {
                    verificationRound,
                    researchAttempt,
                    query: fallbackQuery
                  });
                  continue;
                }

                let successfulFallbackFetches = 0;
                for (const [candidateIndex, candidate] of candidates.entries()) {
                  if (successfulFallbackFetches >= 2) break;
                  attemptedFallbackUrls.add(candidate.url);

                  const fetchCall: ModelToolCall = {
                    id: `${run.requestId}:grounding-fallback-fetch:${verificationRound}:${researchAttempt}:${candidateIndex}`,
                    name: "web_fetch",
                    input: { url: candidate.url }
                  };
                  loopGuard.record({ action: fetchCall.name, inputHash: hashInput(fetchCall.input) });
                  await this.queue.step(run.runId, "tool", "waiting_for_tool", "web_fetch", {
                    toolCallId: fetchCall.id,
                    verificationRound,
                    researchAttempt,
                    candidateIndex,
                    url: candidate.url,
                    deterministicEvidenceFallback: true
                  });
                  try {
                    const output = await this.tools.execute(run, fetchCall);
                    toolTrace.push({ sequence: toolTrace.length + 1, name: fetchCall.name, input: fetchCall.input, output });
                    messages.push({ role: "assistant", content: "", toolCalls: [fetchCall] });
                    messages.push({ role: "tool", name: fetchCall.name, toolCallId: fetchCall.id, content: compactToolOutput(output) });
                    openedNewSource = true;
                    successfulFallbackFetches += 1;
                  } catch (error) {
                    await this.queue.step(run.runId, "tool", "blocked", "Deterministic evidence fallback source fetch failed", {
                      verificationRound,
                      researchAttempt,
                      candidateIndex,
                      url: candidate.url,
                      error: error instanceof Error ? error.message : "web_fetch_failed"
                    });
                  }
                }
                continue;'''
          if old not in text:
              raise SystemExit('expected processor block not found; refusing patch')
          patched = text.replace(old, new, 1)
          if patched == text:
              raise SystemExit('processor patch made no change')
          path.write_text(patched)
          PY
      - name: Run focused evidence regressions
        run: npx vitest run services/agent-worker/src/current-evidence-diversity.test.ts services/agent-worker/src/current-evidence-fallback.test.ts services/agent-worker/src/current-evidence-retry.test.ts
      - name: Commit production fix only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff -- services/agent-worker/src/processor.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-worker/src/processor.ts
          git commit -m 'fix: gather redundant fallback evidence'
          git push origin HEAD:fix/post-load-evidence-diversity-20260827
