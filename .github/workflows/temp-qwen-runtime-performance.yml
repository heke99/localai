name: Temporary Qwen runtime performance

on:
  push:
    branches: ["perf/qwen-runtime-latency-phase-never"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpuhub-production
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-gpuhub
    env:
      GPUHUB_SSH_HOST: ${{ secrets.GPUHUB_SSH_HOST }}
      GPUHUB_SSH_PORT: ${{ secrets.GPUHUB_SSH_PORT }}
      GPUHUB_SSH_USER: ${{ secrets.GPUHUB_SSH_USER }}
      GPUHUB_SSH_PRIVATE_KEY: ${{ secrets.GPUHUB_SSH_PRIVATE_KEY }}
      GPUHUB_SSH_KNOWN_HOSTS: ${{ secrets.GPUHUB_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in GPUHUB_SSH_HOST GPUHUB_SSH_PORT GPUHUB_SSH_USER GPUHUB_SSH_PRIVATE_KEY GPUHUB_SSH_KNOWN_HOSTS; do [[ -n "${!name:-}" ]] || exit 1; done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$GPUHUB_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GPUHUB_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload benchmark probe
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          opts=(-i "$HOME/.ssh/id_ed25519" -p "$GPUHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" "$remote" 'cat > /tmp/div3rsa-qwen-runtime-perf.mjs' < scripts/temp_qwen_runtime_perf_probe.mjs

      - name: Benchmark baseline, cache reuse, ngram and combined
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${GPUHUB_SSH_USER}@${GPUHUB_SSH_HOST}"
          opts=(-i "$HOME/.ssh/id_ed25519" -p "$GPUHUB_SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${opts[@]}" "$remote" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          root=/root/autodl-tmp/localai
          app="$root/app"
          server="$root/runtime/llama.cpp/build/bin/llama-server"
          model="$root/models/qwen/current/Qwen3.8-27B-OBLITERATED-Q8_0.gguf"
          keyfile="$root/secrets/inference-api-key"
          node="$root/runtime/node-current/bin/node"
          logdir="$root/logs/runtime-perf-$(date -u +%Y%m%dT%H%M%SZ)"
          mkdir -p "$logdir"
          cd "$app"
          expected=a173e8cd71e40ba8ec4dfd92e3a1b3829050905c
          [[ "$(git rev-parse HEAD)" == "$expected" ]] || { echo "wrong production SHA" >&2; exit 1; }

          health() { curl --fail --silent --show-error --max-time 3 http://127.0.0.1:6006/health >/dev/null 2>&1; }
          stop_model() {
            mapfile -t pids < <(pgrep -f 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf' || true)
            for pid in "${pids[@]}"; do kill -TERM "$pid" 2>/dev/null || true; done
            for _ in {1..80}; do [[ -z "$(pgrep -f 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf' || true)" ]] && return 0; sleep 0.25; done
            mapfile -t pids < <(pgrep -f 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf' || true)
            for pid in "${pids[@]}"; do kill -KILL "$pid" 2>/dev/null || true; done
            sleep 1
          }
          wait_boot() {
            for _ in {1..180}; do health && return 0; sleep 1; done
            return 1
          }
          start_model() {
            local name="$1"; shift
            stop_model
            echo "=== START $name: $* ==="
            nohup "$server" --model "$model" --alias localai-qwen38-v3-q8 --host 0.0.0.0 --port 6006 --api-key-file "$keyfile" -ngl all --ctx-size 262144 --parallel 8 --cont-batching --flash-attn on --batch-size 2048 --ubatch-size 512 --no-webui "$@" >"$logdir/$name.server.log" 2>&1 &
            echo $! > "$logdir/$name.pid"
            wait_boot || { tail -n 120 "$logdir/$name.server.log" >&2; return 1; }
            pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf'
          }
          run_probe() {
            local name="$1"
            echo "=== PROBE $name ==="
            "$node" /tmp/div3rsa-qwen-runtime-perf.mjs "$name" | tee "$logdir/$name.json"
          }
          restore() {
            status=$?
            trap - EXIT INT TERM
            set +e
            echo "=== RESTORE PRODUCTION BASELINE ==="
            stop_model
            DIV3RSA_FORCE_MODEL_RESTART=1 DIV3RSA_MODEL_PARALLEL=8 DIV3RSA_MODEL_CONTEXT_SIZE=262144 bash "$app/infra/runtime/recover-legacy-gpuhub.sh"
            restore_status=$?
            rm -f /tmp/div3rsa-qwen-runtime-perf.mjs
            curl --fail --silent --show-error --max-time 5 http://127.0.0.1:6006/health >/dev/null
            screen -list | grep -F '.localai-agent' >/dev/null
            pgrep -af 'llama-server.*Qwen3\.8-27B-OBLITERATED-Q8_0\.gguf'
            echo "Evidence: $logdir"
            if [[ "$restore_status" -ne 0 ]]; then exit "$restore_status"; fi
            exit "$status"
          }
          trap restore EXIT INT TERM

          # Stop the worker first so no queued production run enters a server that
          # is about to be restarted. Existing direct model requests are allowed a
          # short drain window before the fresh baseline starts.
          screen -S localai-agent -X quit >/dev/null 2>&1 || true
          sleep 2
          for _ in {1..40}; do
            active="$(curl --silent --max-time 2 -H "Authorization: Bearer $(cat "$keyfile")" http://127.0.0.1:6006/slots 2>/dev/null | python3 -c 'import json,sys; print(sum(1 for x in json.load(sys.stdin) if x.get("is_processing")))' 2>/dev/null || echo 0)"
            [[ "$active" == "0" ]] && break
            sleep 1
          done

          start_model baseline
          run_probe baseline
          start_model cache_reuse_256 --cache-reuse 256
          run_probe cache_reuse_256
          start_model ngram_mod --spec-type ngram-mod
          run_probe ngram_mod
          start_model combined --cache-reuse 256 --spec-type ngram-mod
          run_probe combined

          python3 - "$logdir" <<'PY'
          import json, pathlib, statistics, sys
          root=pathlib.Path(sys.argv[1])
          rows=[]
          for name in ('baseline','cache_reuse_256','ngram_mod','combined'):
              d=json.loads((root/f'{name}.json').read_text())
              arch=[c for c in d['cases'] if c['name'].startswith('architecture_')]
              rows.append({
                  'name':name,
                  'quality':d['quality'],
                  'architecture_first_content_median_ms':round(statistics.median(c['firstContentMs'] for c in arch if c['firstContentMs'] is not None)),
                  'architecture_total_median_ms':round(statistics.median(c['totalMs'] for c in arch)),
                  'prefix_total_ms':[x['totalMs'] for x in d['prefixResults']],
                  'architecture_tokens':[c.get('usage',{}).get('completion_tokens') if c.get('usage') else None for c in arch]
              })
          baseline=rows[0]
          for r in rows:
              r['architecture_total_speedup_pct']=round((baseline['architecture_total_median_ms']/r['architecture_total_median_ms']-1)*100,1)
              r['architecture_first_content_speedup_pct']=round((baseline['architecture_first_content_median_ms']/r['architecture_first_content_median_ms']-1)*100,1)
          print('=== SUMMARY ===')
          print(json.dumps(rows, indent=2))
          PY
          REMOTE
