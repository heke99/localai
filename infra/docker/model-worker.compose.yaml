services:
  qwen-v2-q8:
    image: "${LLAMA_CPP_IMAGE:?Set an immutable llama.cpp image reference with @sha256 digest}"
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3.8-27B-OBLITERATED-Q8_0.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${DIV3RSA_MODEL_CONTEXT_SIZE:-32768}"
      - --batch-size
      - "${DIV3RSA_MODEL_BATCH_SIZE:-2048}"
      - --parallel
      - "${DIV3RSA_MODEL_PARALLEL:-4}"
      - --n-gpu-layers
      - "999"
      - --metrics
      - --jinja
      - --api-key
      - "${QWEN_INFERENCE_API_KEY:?Set a private inference API key}"
    volumes:
      - "${DIV3RSA_MODEL_DIR:?Set the verified model directory}:/models:ro"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=2g,noexec,nosuid
    networks:
      - inference

  agent-worker:
    build:
      context: ../..
      dockerfile: infra/docker/agent-worker.Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:?Set an immutable Node image reference with @sha256 digest}"
    restart: unless-stopped
    depends_on:
      qwen-v2-q8:
        condition: service_healthy
    environment:
      SUPABASE_URL: "${SUPABASE_URL:?Set Supabase URL}"
      SUPABASE_SECRET_KEY: "${SUPABASE_SECRET_KEY:?Set server-only Supabase secret}"
      QWEN_INFERENCE_BASE_URL: http://qwen-v2-q8:8080/v1
      QWEN_INFERENCE_API_KEY: "${QWEN_INFERENCE_API_KEY:?Set inference API key}"
      DIV3RSA_WORKER_ID: "${DIV3RSA_WORKER_ID:-agent-worker-1}"
      DIV3RSA_REPOSITORY_ROOT: /app
      DIV3RSA_MODEL_CONTEXT_SIZE: "${DIV3RSA_MODEL_CONTEXT_SIZE:-32768}"
      DIV3RSA_MODEL_BATCH_SIZE: "${DIV3RSA_MODEL_BATCH_SIZE:-2048}"
      DIV3RSA_ADMISSION_MAX_ACTIVE_SEQUENCES: "${DIV3RSA_ADMISSION_MAX_ACTIVE_SEQUENCES:-4}"
      DIV3RSA_ADMISSION_MAX_DEFERRED_REQUESTS: "${DIV3RSA_ADMISSION_MAX_DEFERRED_REQUESTS:-4}"
      DIV3RSA_ADMISSION_MAX_KV_CACHE_RATIO: "${DIV3RSA_ADMISSION_MAX_KV_CACHE_RATIO:-0.90}"
      DIV3RSA_ADMISSION_MIN_TOKENS_PER_SECOND: "${DIV3RSA_ADMISSION_MIN_TOKENS_PER_SECOND:-8}"
      DIV3RSA_ADMISSION_MAX_TTFT_MS: "${DIV3RSA_ADMISSION_MAX_TTFT_MS:-5000}"
      DIV3RSA_ADMISSION_MAX_INTER_TOKEN_MS: "${DIV3RSA_ADMISSION_MAX_INTER_TOKEN_MS:-125}"
      DIV3RSA_ADMISSION_MAX_GPU_RATIO: "${DIV3RSA_ADMISSION_MAX_GPU_RATIO:-0.98}"
      DIV3RSA_ADMISSION_MAX_VRAM_RATIO: "${DIV3RSA_ADMISSION_MAX_VRAM_RATIO:-0.94}"
      DIV3RSA_ADMISSION_MAX_CONTEXT_HIGH_WATERMARK_RATIO: "${DIV3RSA_ADMISSION_MAX_CONTEXT_HIGH_WATERMARK_RATIO:-0.95}"
      DIV3RSA_ADMISSION_POLL_INTERVAL_MS: "${DIV3RSA_ADMISSION_POLL_INTERVAL_MS:-250}"
      DIV3RSA_ADMISSION_MAX_WAIT_MS: "${DIV3RSA_ADMISSION_MAX_WAIT_MS:-30000}"
      DIV3RSA_ADMISSION_TELEMETRY_TIMEOUT_MS: "${DIV3RSA_ADMISSION_TELEMETRY_TIMEOUT_MS:-1000}"
      DIV3RSA_GPU_METRICS_URL: "${DIV3RSA_GPU_METRICS_URL:-}"
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    networks:
      - inference
      - control-plane

networks:
  inference:
    internal: true
  control-plane: {}
