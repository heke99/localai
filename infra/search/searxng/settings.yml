use_default_settings: true

general:
  debug: false
  instance_name: "DIV3RSA Search"

search:
  safe_search: 1
  autocomplete: ""
  formats:
    - html
    - json

server:
  # Overridden by SEARXNG_SECRET in production.
  secret_key: "runtime-secret-required"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
